name = "five-seconds-rule"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "five-seconds-rule-db"
database_id = "YOUR_D1_DATABASE_ID"

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_classes = ["GameRoom"]

[vars]
ENVIRONMENT = "production"
